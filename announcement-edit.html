<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS4998 – Edit Announcement</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="announcements.css" />
  <link rel="stylesheet" href="announcement-edit.css" />
  <script type="module" src="sidebar.js"></script>
</head>
<body class="announcement-edit-page" data-announcement-view="edit">
  <div class="app-layout">
    <cmsx-sidebar></cmsx-sidebar>
    <main class="main-content">
      <div class="content-wrapper announcement-edit-shell" data-node-id="1971:51868">
        <header class="page-header announcement-page-header">
          <div class="page-title-group">
            <h1 class="page-title">CS4998 Intro to CMSX</h1>
            <nav class="breadcrumbs" aria-label="Breadcrumb">
              <a class="breadcrumb-link" href="index.html">CS4998 Intro to CMSX</a>
              <span class="breadcrumb-sep" aria-hidden="true"><img src="assets/announcement-editor/chevron-right.svg" alt="" aria-hidden="true" /></span>
              <a class="breadcrumb-link" href="course-home.html">Home</a>
              <span class="breadcrumb-sep" aria-hidden="true"><img src="assets/announcement-editor/chevron-right.svg" alt="" aria-hidden="true" /></span>
              <a class="breadcrumb-link" href="announcements.html">Announcements</a>
            </nav>
          </div>
        </header>
        <section class="announcement-editor-section" aria-labelledby="editorHeading">
          <h2 id="editorHeading">Edit Announcement</h2>
          <form class="announcement-form" id="announcementForm">
            <div class="announcement-field-row" data-node-id="1971:51879">
              <label for="announcementTitle">Title</label>
              <input id="announcementTitle" name="title" type="text" autocomplete="off" required />
            </div>
            <div class="announcement-field-row announcement-category-row" data-node-id="1971:51882">
              <span class="field-label" id="categoryLabel">Category</span>
              <div class="editor-category-chips" id="editorCategoryChips" role="group" aria-labelledby="categoryLabel"></div>
            </div>
            <div class="announcement-edit-grid" data-node-id="1978:4740">
              <div class="rich-editor-frame" data-node-id="1971:51890">
                <div class="rich-editor-toolbar" role="toolbar" aria-label="Announcement formatting">
                  <div class="toolbar-group"><button type="button" class="toolbar-button" data-command="undo" aria-label="Undo" title="Undo"><img src="assets/announcement-editor/undo.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" data-command="redo" aria-label="Redo" title="Redo"><img src="assets/announcement-editor/redo.svg" alt="" aria-hidden="true" /></button></div><span class="toolbar-divider" aria-hidden="true"></span>
                  <label class="toolbar-size-control">
                    <img src="assets/announcement-editor/text-size.svg" alt="" aria-hidden="true" />
                    <select id="editorTextSize" aria-label="Text size">
                      <option value="2">Small</option><option value="3" selected>Medium</option><option value="5">Large</option>
                    </select>
                  </label><span class="toolbar-divider" aria-hidden="true"></span>
                  <div class="toolbar-group"><button type="button" class="toolbar-button" data-command="bold" aria-pressed="false" aria-label="Bold" title="Bold"><img src="assets/announcement-editor/bold.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" data-command="italic" aria-pressed="false" aria-label="Italic" title="Italic"><img src="assets/announcement-editor/italic.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" data-command="underline" aria-pressed="false" aria-label="Underline" title="Underline"><img src="assets/announcement-editor/underline.svg" alt="" aria-hidden="true" /></button></div><span class="toolbar-divider" aria-hidden="true"></span>
                  <div class="toolbar-group"><button type="button" class="toolbar-button" id="attachFileButton" aria-label="Attach file" title="Attach file"><img src="assets/announcement-editor/attachment.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" id="insertLinkButton" aria-label="Insert link" title="Insert link"><img src="assets/announcement-editor/link.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" id="insertImageButton" aria-label="Insert image" title="Insert image"><img src="assets/announcement-editor/image.svg" alt="" aria-hidden="true" /></button></div><span class="toolbar-divider" aria-hidden="true"></span>
                  <div class="toolbar-group"><button type="button" class="toolbar-button" id="insertTableButton" aria-label="Insert table" title="Insert table"><img src="assets/announcement-editor/table.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list"><img src="assets/announcement-editor/list.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" data-command="formatBlock" data-value="pre" aria-label="Code block" title="Code block"><img src="assets/announcement-editor/code.svg" alt="" aria-hidden="true" /></button><button type="button" class="toolbar-button" id="insertFormulaButton" aria-label="Insert formula" title="Insert formula"><img src="assets/announcement-editor/formula.svg" alt="" aria-hidden="true" /></button></div>
                </div>
                <div class="rich-editor" id="announcementBody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Announcement body" data-node-id="1971:51892"></div>
              </div>
              <aside class="announcement-history" aria-labelledby="historyHeading" data-node-id="1974:52158">
                <h3 id="historyHeading"><img src="assets/announcement-editor/history.svg" alt="" aria-hidden="true" />Version History</h3>
                <div class="announcement-version-list" id="versionHistoryPanel"></div>
              </aside>
            </div>
            <div class="announcement-form-footer" data-node-id="1971:51910">
              <button type="button" class="btn btn-outlined editor-delete-button" id="deleteAnnouncementButton"><img src="assets/announcement-editor/delete.svg" alt="" aria-hidden="true" />Delete Announcement</button>
              <div class="announcement-form-actions">
                <label class="notify-checkbox">
                  <input id="notifyByEmail" type="checkbox" checked />
                  <span class="notify-check-art" aria-hidden="true"><img src="assets/announcement-editor/checkbox.svg" alt="" aria-hidden="true" /></span>
                  <span>Notify by Email</span>
                </label>
                <a class="editor-cancel-button" href="announcements.html">Cancel</a>
                <button class="btn btn-primary editor-post-button" type="submit">Update</button>
              </div>
            </div>
            <input id="announcementAttachment" type="file" hidden />
          </form>
        </section>
      </div>
    </main>
  </div>
  <div class="announcement-toast" id="announcementToast" role="status" aria-live="polite"></div>
  <script type="module" src="announcements.js"></script>
</body>
</html>
