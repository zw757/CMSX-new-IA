<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS4998 – Announcements</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="announcements.css" />
  <script type="module" src="sidebar.js"></script>
</head>
<body class="announcements-page" data-announcement-view="list">
  <div class="app-layout">
    <cmsx-sidebar></cmsx-sidebar>

    <main class="main-content">
      <div class="content-wrapper announcement-shell" data-node-id="605:16970">
        <header class="page-header announcement-page-header">
          <div class="page-title-group">
            <h1 class="page-title">CS4998 Intro to CMSX</h1>
            <nav class="breadcrumbs" aria-label="Breadcrumb">
              <a class="breadcrumb-link" href="index.html">CS4998 Intro to CMSX</a>
              <span class="breadcrumb-sep" aria-hidden="true"><span class="material-icons">chevron_right</span></span>
              <a class="breadcrumb-link" href="course-home.html">Home</a>
              <span class="breadcrumb-sep" aria-hidden="true"><span class="material-icons">chevron_right</span></span>
              <span class="breadcrumb-link" aria-current="page">Announcements</span>
            </nav>
          </div>
        </header>

        <section class="announcement-archive" aria-labelledby="archiveTitle">
          <div class="archive-heading-row">
            <div class="archive-title-group">
              <h2 id="archiveTitle">Previous Announcements</h2>
              <span class="archive-count" id="announcementCount">10 TOTAL</span>
            </div>
            <a class="btn btn-primary archive-new-button" href="announcement-edit.html?mode=new">
              <span aria-hidden="true">+</span> New Announcement
            </a>
          </div>

          <div class="archive-filter-row">
            <div class="announcement-categories" id="categoryFilters" aria-label="Filter announcements by category"></div>
            <button class="deleted-items-button" id="deletedItemsButton" type="button" aria-pressed="false">
              <span class="material-icons" aria-hidden="true">delete_outline</span>
              <span>Deleted Items</span>
            </button>
          </div>

          <div class="announcement-sections" id="announcementSections" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="announcement-toast" id="announcementToast" role="status" aria-live="polite"></div>
  <script type="module" src="announcements.js"></script>
</body>
</html>
