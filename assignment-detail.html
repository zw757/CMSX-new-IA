<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMSX – Assignment</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="assignment-detail.css" />
  <script type="module" src="sidebar.js"></script>
  <script type="module" src="designer-tag.js"></script>
  <script type="module" src="rail-toggle.js"></script>
</head>
<body class="assignment-detail-page">
  <div class="app-layout">
    <cmsx-sidebar></cmsx-sidebar>

    <main class="main-content">
      <div class="content-wrapper">
        <div class="assignment-workspace rail-layout">
          <aside class="assignment-tools rail-panel" id="assignmentControls" aria-label="Submission filters and assignment information">
            <header class="assignment-rail-header">
              <h1 class="page-title" id="assignmentTitle">Assignment 3: Grading Systems</h1>
              <nav class="breadcrumbs" aria-label="Breadcrumb">
                <a class="breadcrumb-link" href="course-home.html" title="CS4998 Intro to CMSX">CS4998</a>
                <span class="breadcrumb-sep" aria-hidden="true"><span class="material-icons">chevron_right</span></span>
                <a class="breadcrumb-link" href="assignments.html">Assignments</a>
              </nav>
            </header>
            <section class="assignment-filter-panel" aria-labelledby="filterHeading">
              <header class="assignment-filter-panel-heading">
                <h2 id="filterHeading">Filter</h2>
              </header>
              <div class="assignment-filter-grid">
                <label class="assignment-filter">
                  <span class="filter-name">Assigned to</span>
                  <select id="graderFilter">
                    <option value="">Anyone</option>
                    <option>May</option>
                    <option>Sylvia</option>
                    <option>Erica</option>
                  </select>
                </label>
                <label class="assignment-filter">
                  <span class="filter-name">For</span>
                  <select id="problemFilter">
                    <option value="">Any problem</option>
                    <option value="problem-1">Problem 1: Rules</option>
                    <option value="problem-2">Problem 2: Rubric</option>
                    <option value="problem-3">Problem 3: Scores</option>
                    <option value="problem-4">Problem 4: Notes</option>
                  </select>
                </label>
                <label class="assignment-filter">
                  <span class="filter-name">Section</span>
                  <select id="sectionFilter">
                    <option value="">Any section</option>
                    <option value="001">Section 001</option>
                    <option value="002">Section 002</option>
                  </select>
                </label>
                <label class="assignment-filter">
                  <span class="filter-name">Status</span>
                  <select id="statusFilter">
                    <option value="">Any status</option>
                    <option value="graded">Graded</option>
                    <option value="ungraded">Ungraded</option>
                    <option value="regrade">Regrade pending</option>
                    <option value="partial">Partially submitted</option>
                    <option value="not-submitted">Not submitted</option>
                  </select>
                </label>
                <fieldset class="assignment-filter score-filter">
                  <legend class="filter-name">Total score</legend>
                  <div class="score-range">
                    <label><span class="sr-only">Lowest score</span><input id="scoreLowFilter" type="number" min="0" max="100" value="0" aria-label="Lowest score" /></label>
                    <span>to</span>
                    <label><span class="sr-only">Highest score</span><input id="scoreHighFilter" type="number" min="0" max="100" value="100" aria-label="Highest score" /></label>
                  </div>
                </fieldset>
              </div>
              <footer class="assignment-filter-footer">
                <span id="filterResults" role="status" aria-live="polite">800 submissions</span>
                <button id="clearFiltersButton" type="button" hidden>Clear all</button>
              </footer>
              <div class="assignment-filter-actions">
                <button class="btn btn-primary assignment-select-filtered" id="selectFilteredStudents" type="button" disabled>Select filtered groups</button>
              </div>
            </section>

          </aside>

          <button class="assignment-rail-edge-toggle" type="button" data-rail-toggle data-name="filters" aria-controls="assignmentControls" aria-expanded="true">
            <span class="material-icons" aria-hidden="true">chevron_left</span><span class="sr-only rail-toggle-text">Hide filters</span>
          </button>

          <section class="assignment-submissions" aria-label="Submissions">
            <div class="assignment-table-top-row">
              <div class="cmsx-underline-search">
                <label for="studentFilter">Search submissions</label>
                <div class="cmsx-underline-search-input">
                  <input id="studentFilter" type="search" placeholder="Search by ID or group member…" autocomplete="off" />
                  <button id="clearStudentSearch" type="button" aria-label="Clear submission search"><span class="material-icons" aria-hidden="true">close</span></button>
                </div>
                <div class="cmsx-underline-search-rule" aria-hidden="true"></div>
              </div>
              <button class="btn btn-outlined assignment-column-toggle" id="toggleAssignedTo" type="button" aria-controls="assignmentTable" aria-pressed="false">Show assigned to</button>
              <div class="assignment-selection-toolbar" id="assignmentSelectionToolbar" hidden>
                <span id="assignmentSelectionCount">0 submissions selected</span>
                <div class="assignment-selection-actions">
                  <button class="btn btn-primary" id="gradeAllButton" type="button" disabled>Grade</button>
                  <details class="assignment-group-menu" id="assignmentGroupMenu">
                    <summary class="btn btn-outlined">Group operations <span class="material-icons" aria-hidden="true">expand_more</span></summary>
                    <div class="assignment-group-menu-panel">
                      <p class="assignment-group-menu-title">Select group operations</p>
                      <div class="assignment-group-menu-actions">
                        <button class="assignment-group-menu-item" id="gradingCsvButton" type="button" disabled>Grading CSV</button>
                        <button class="assignment-group-menu-item" id="filesButton" type="button" disabled>Files</button>
                        <button class="assignment-group-menu-item" id="emailSelectedButton" type="button" disabled>Email</button>
                        <button class="assignment-group-menu-item" id="gradeIndividuallyButton" type="button" disabled>Grade one by one</button>
                        <button class="assignment-group-menu-item" id="feedbackZipButton" type="button" disabled>Feedback ZIP</button>
                      </div>
                      <div class="assignment-group-menu-divider" role="separator"></div>
                      <label class="assignment-group-menu-field" for="bulkExtension">
                        <span>Extension deadline</span>
                        <input id="bulkExtension" type="datetime-local" disabled />
                      </label>
                      <button class="assignment-group-menu-apply" id="applyExtensionsButton" type="button" disabled>Extensions</button>
                      <div class="assignment-group-menu-divider" role="separator"></div>
                      <label class="assignment-group-menu-field" for="assignGrader">
                        <span>Grader</span>
                        <select id="assignGrader" disabled>
                          <option value="">Choose grader</option>
                          <option value="May">Wu, May (zw757)</option>
                          <option value="Sylvia">Tai, Sylvia (st2233)</option>
                          <option value="Erica">Lee, Erica (el728)</option>
                        </select>
                      </label>
                      <button class="assignment-group-menu-apply" id="assignGraderButton" type="button" disabled>Assign Grader</button>
                    </div>
                  </details>
                </div>
              </div>
            </div>

            <div class="assignment-table-shell" role="region" aria-label="Scrollable submissions table" tabindex="0">
              <table class="assignment-table" id="assignmentTable">
                <thead>
                  <tr>
                    <th class="selection-column"><input id="selectAllRows" type="checkbox" aria-label="Select all matching submissions" /></th>
                    <th class="number-column"><span class="sr-only">Row</span></th>
                    <th><button class="table-sort" type="button" data-sort="netid"><span id="submissionIdHeading">NetID</span><span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th><button class="table-sort" type="button" data-sort="name">Group<span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th><button class="table-sort" type="button" data-sort="status">Submission Status<span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th class="extension-column">Extension</th>
                    <th class="slip-days-column"><button class="table-sort" type="button" data-sort="slipDaysUsed">Slip Days Used<span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th class="files-column">Files</th>
                    <th class="assigned-to-column" id="assignedToHeader" hidden><button class="table-sort" type="button" data-sort="grader">Assigned to<span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th class="grade-column"><button class="table-sort" type="button" data-sort="total">Score<span class="material-icons" aria-hidden="true">swap_vert</span></button></th>
                    <th class="actions-column">Actions</th>
                  </tr>
                </thead>
                <tbody id="submissionsBody"></tbody>
              </table>
            </div>

          </section>
        </div>
      </div>
    </main>
  </div>

  <cmsx-designer-tag name="jessica a"></cmsx-designer-tag>
  <div class="assignment-toast" id="assignmentToast" role="status" aria-live="polite"></div>
  <script type="module" src="assignment-detail.js"></script>
</body>
</html>
