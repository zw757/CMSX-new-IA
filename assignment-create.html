<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS4998 – Create Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="sidebar.js"></script>
  <style>
    .creation-page {
      background: #fff;
      font-family: "Roboto", Arial, sans-serif;
    }

    .creation-main {
      flex: 1;
      min-width: 0;
      margin-left: 68px;
      min-height: 1117px;
      padding: var(--page-shell-padding-top) var(--page-shell-padding-inline) var(--page-shell-padding-bottom);
      background: #f7f7f7;
    }
    .creation-shell {
      width: 1171px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .creation-header {
      min-height: var(--page-header-min-height);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
    }
    .creation-title {
      font-family: "Helvetica Neue", "Roboto", Arial, sans-serif;
      font-size: var(--font-size-title);
      font-weight: 500;
      line-height: var(--line-height-title);
      color: var(--text-primary);
    }
    .creation-breadcrumbs {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: var(--text-primary);
      opacity: .56;
      font-size: var(--font-size-ui);
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
    }
    .creation-breadcrumbs a:hover { text-decoration: underline; }
    .creation-breadcrumbs .material-icons {
      width: 36px;
      font-size: 20px;
      line-height: 20px;
      text-align: center;
    }

    .type-panel {
      padding: 20px 24px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-heading {
      font-size: var(--font-size-section);
      font-weight: 500;
      line-height: var(--line-height-section);
      letter-spacing: .15px;
      color: var(--text-primary);
    }
    .type-selector {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .type-card {
      min-height: 80px;
      padding: 16px;
      border: 2px solid #b1b6c2;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: var(--text-primary);
      font-family: "Roboto", Arial, sans-serif;
      text-align: left;
      transition: border-color .15s, box-shadow .15s;
    }
    .type-card:hover { border-color: var(--primary); }
    .type-card:focus-visible {
      outline: 3px solid rgba(0, 102, 153, .22);
      outline-offset: 2px;
    }
    .type-card.selected { border-color: var(--primary); }
    .type-card-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      color: #b1b6c2;
    }
    .type-card-icon .material-icons { font-size: 30px; }
    .type-card.selected .type-card-icon { color: var(--primary); }
    .type-card-copy { display: flex; flex-direction: column; align-items: flex-start; }
    .type-card-label {
      font-size: var(--font-size-body);
      font-weight: 500;
      line-height: var(--line-height-body);
      letter-spacing: .15px;
      white-space: nowrap;
    }
    .type-card-desc {
      font-size: var(--font-size-caption);
      font-weight: 400;
      line-height: var(--line-height-caption);
      letter-spacing: .4px;
      white-space: nowrap;
    }

    .creation-content {
      display: grid;
      grid-template-columns: 230px minmax(0, 925px);
      gap: 16px;
      min-height: 790px;
      margin-top: -16px;
    }
    .section-rail,
    .basic-information { background: #fff; }
    .section-rail {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }
    .section-rail-top {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .progress-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 24px;
      list-style: none;
    }
    .progress-list::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 15px;
      bottom: 15px;
      width: 1px;
      background: #b1b6c2;
    }
    .progress-step {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .step-number {
      width: 27px;
      height: 27px;
      border: 2px solid #b1b6c2;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #b1b6c2;
      font-size: var(--font-size-ui);
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
    }
    .progress-step.active .step-number {
      border-color: var(--primary);
      background: #e5f6fd;
      color: var(--primary);
    }
    .step-copy { min-width: 0; padding-top: 1px; }
    .step-label {
      display: block;
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      letter-spacing: .15px;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .step-description {
      display: block;
      margin-top: -1px;
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
      letter-spacing: .15px;
      color: #606572;
      white-space: nowrap;
    }
    .rail-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .rail-button {
      width: 100%;
      min-height: 36px;
      padding: 6px 16px;
      border: 1px solid var(--primary);
      border-radius: 4px;
      box-shadow: var(--shadow-2);
      font-family: "Helvetica Neue", "Roboto", Arial, sans-serif;
      font-size: var(--font-size-ui);
      font-weight: 500;
      line-height: var(--line-height-ui);
      letter-spacing: .4px;
      color: var(--primary);
      background: #fff;
    }
    .rail-button.primary { color: #fff; background: var(--primary); }
    .rail-button:hover { background: #f3f9fc; }
    .rail-button.primary:hover { background: var(--primary-dark); }

    .basic-information {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: flex-end;
    }
    .basic-information > .section-heading { align-self: stretch; }
    .field-row {
      align-self: stretch;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .create-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .create-label,
    .status-legend {
      font-size: var(--font-size-ui);
      font-weight: 500;
      line-height: var(--line-height-ui);
      letter-spacing: .1px;
      color: var(--text-primary);
    }
    .required { color: var(--error); }
    .create-input,
    .description-input {
      width: 100%;
      border: 1px solid rgba(0, 0, 0, .23);
      border-radius: 4px;
      color: var(--text-primary);
      background: #fff;
      font-family: "Roboto", Arial, sans-serif;
      font-size: var(--font-size-ui);
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
      outline: 0;
      transition: border-color .15s, box-shadow .15s;
    }
    .create-input { height: 56px; padding: 16px 12px; }
    .create-input::placeholder,
    .description-input::placeholder { color: rgba(0, 0, 0, .38); opacity: 1; }
    .create-input:focus,
    .description-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .status-fieldset {
      align-self: stretch;
      border: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .status-options { display: flex; flex-direction: column; gap: 12px; }
    .status-option {
      position: relative;
      min-height: 60px;
      padding: 8px 12px;
      border: 1px solid rgba(0, 0, 0, .23);
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .status-option:hover { border-color: var(--primary); }
    .status-option.selected {
      border: 2px solid var(--primary);
      padding: 7px 11px;
      background: #e5f6fd;
    }
    .status-option input {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border: 1px solid #b1b6c2;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
    }
    .status-option input::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      transform: scale(0);
    }
    .status-option input:checked { border-color: var(--primary); }
    .status-option input:checked::before { transform: scale(1); }
    .status-option input:focus-visible {
      outline: 3px solid rgba(0, 102, 153, .22);
      outline-offset: 3px;
    }
    .status-copy { min-width: 0; display: flex; flex-direction: column; }
    .status-name {
      font-size: var(--font-size-ui);
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
      color: rgba(0, 0, 0, .6);
    }
    .status-description {
      font-size: var(--font-size-ui);
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
      color: rgba(0, 0, 0, .38);
    }

    .description-field { align-self: stretch; }
    .description-input {
      height: 145px;
      padding: 16px 12px;
      resize: none;
      display: block;
    }
    .character-count {
      min-height: 23px;
      padding: 3px 14px 0;
      font-size: var(--font-size-caption);
      line-height: var(--line-height-caption);
      letter-spacing: .4px;
      color: rgba(0, 0, 0, .6);
    }
    .next-button {
      min-height: 53px;
      padding: 10px 16px;
      border: 2px solid var(--primary);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--primary);
      font-family: "Roboto", Arial, sans-serif;
      font-size: var(--font-size-ui);
      font-weight: 500;
      line-height: var(--line-height-ui);
      letter-spacing: .15px;
    }
    .next-button:hover { background: #f3f9fc; }
    .next-button .material-icons { font-size: 24px; }
    .form-message {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 400;
      padding: 12px 18px;
      border-radius: 4px;
      color: #fff;
      background: #2f3542;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
      font-size: var(--font-size-ui); line-height: var(--line-height-ui);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s, transform .18s;
    }
    .form-message.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 1320px) {
      .creation-content { grid-template-columns: 220px minmax(0, 1fr); }
      .type-selector { gap: 12px; }
      .type-card { padding: 12px; }
      .type-card-label { font-size: var(--font-size-body); line-height: var(--line-height-body); }
      .type-card-desc { font-size: var(--font-size-caption); line-height: var(--line-height-caption); }
    }
    @media (max-width: 980px) {
      .creation-shell { gap: 24px; }
      .creation-content {
        grid-template-columns: 1fr;
        min-height: auto;
        margin-top: -8px;
      }
      .section-rail { gap: 28px; }
      .progress-list { display: grid; grid-template-columns: repeat(2, 1fr); }
      .progress-list::before { display: none; }
      .rail-actions { flex-direction: row; }
      .rail-button { width: auto; flex: 1; }
    }
    @media (max-width: 900px) {
      .creation-header { min-height: 0; justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .creation-main { margin-left: 56px; min-height: 100vh; }
      .creation-breadcrumbs { font-size: var(--font-size-ui); line-height: var(--line-height-ui); flex-wrap: wrap; }
      .creation-breadcrumbs .material-icons { width: 24px; font-size: 16px; }
      .type-panel,
      .section-rail,
      .basic-information { padding: 18px; }
      .type-selector { display: grid; grid-template-columns: 1fr; }
      .type-card { width: 100%; }
      .field-row { grid-template-columns: 1fr; }
      .progress-list { grid-template-columns: 1fr; }
      .status-description { font-size: var(--font-size-ui); line-height: var(--line-height-ui); }
      .next-button { align-self: stretch; justify-content: center; }
    }
  </style>
</head>
<body class="creation-page">
  <div class="app-layout">
  <cmsx-sidebar></cmsx-sidebar>

    <main class="creation-main">
      <div class="creation-shell">
        <header class="creation-header">
          <h1 class="creation-title">Create Assignment</h1>
          <nav class="creation-breadcrumbs" aria-label="Breadcrumb">
            <a href="course-home.html">CS4998 Intro to CMSX</a>
            <span class="material-icons" aria-hidden="true">chevron_right</span>
            <a href="assignments.html">Assignments</a>
            <span class="material-icons" aria-hidden="true">chevron_right</span>
            <span aria-current="page">Create</span>
          </nav>
        </header>

        <section class="type-panel" aria-labelledby="type-heading">
          <h2 class="section-heading" id="type-heading">Assignment Type</h2>
          <div class="type-selector" role="group" aria-label="Assignment type">
            <button class="type-card selected" id="type-assignment" type="button" data-type="assignment" aria-pressed="true">
              <span class="type-card-icon"><span class="material-icons" aria-hidden="true">article</span></span>
              <span class="type-card-copy">
                <span class="type-card-label">Assignment</span>
                <span class="type-card-desc">Written or coded work</span>
              </span>
            </button>
            <button class="type-card" id="type-quiz" type="button" data-type="quiz" aria-pressed="false">
              <span class="type-card-icon"><span class="material-icons" aria-hidden="true">article</span></span>
              <span class="type-card-copy">
                <span class="type-card-label">Quiz</span>
                <span class="type-card-desc">Timed Assessment</span>
              </span>
            </button>
            <button class="type-card" id="type-survey" type="button" data-type="survey" aria-pressed="false">
              <span class="type-card-icon"><span class="material-icons" aria-hidden="true">article</span></span>
              <span class="type-card-copy">
                <span class="type-card-label">Survey</span>
                <span class="type-card-desc">Anonymous Feedback</span>
              </span>
            </button>
          </div>
        </section>

        <div class="creation-content">
          <aside class="section-rail" aria-labelledby="sections-heading">
            <div class="section-rail-top">
              <h2 class="section-heading" id="sections-heading">Sections</h2>
              <ol class="progress-list" id="progress-list"></ol>
            </div>
            <div class="rail-actions">
              <button class="rail-button" type="button" id="save-draft">Save Draft</button>
              <button class="rail-button primary" type="button" id="publish">Publish</button>
            </div>
          </aside>

          <form class="basic-information" id="assignment-form">
            <h2 class="section-heading">Basic Information</h2>

            <div class="field-row">
              <label class="create-field">
                <span class="create-label">Assignment name <span class="required" aria-hidden="true">*</span></span>
                <input class="create-input" id="assignment-name" name="assignmentName" type="text" placeholder="Ex: Assignment 1 - Intro to CMSX" required />
              </label>
              <label class="create-field">
                <span class="create-label">Short name</span>
                <input class="create-input" id="short-name" name="shortName" type="text" placeholder="Ex: A1" />
              </label>
            </div>

            <fieldset class="status-fieldset">
              <legend class="status-legend">Status <span class="required" aria-hidden="true">*</span></legend>
              <div class="status-options">
                <label class="status-option selected">
                  <input type="radio" name="status" value="hidden" checked />
                  <span class="status-copy">
                    <span class="status-name">Hidden</span>
                    <span class="status-description">Hidden from students — grades still count toward total</span>
                  </span>
                </label>
                <label class="status-option">
                  <input type="radio" name="status" value="open" />
                  <span class="status-copy">
                    <span class="status-name">Open</span>
                    <span class="status-description">Students can submit until due or late deadline, grades hidden</span>
                  </span>
                </label>
                <label class="status-option">
                  <input type="radio" name="status" value="closed" />
                  <span class="status-copy">
                    <span class="status-name">Closed</span>
                    <span class="status-description">Extension-only submissions, grades hidden</span>
                  </span>
                </label>
                <label class="status-option">
                  <input type="radio" name="status" value="graded" />
                  <span class="status-copy">
                    <span class="status-name">Graded</span>
                    <span class="status-description">Extension submissions, grades + solutions visible if graded</span>
                  </span>
                </label>
              </div>
            </fieldset>

            <label class="create-field description-field">
              <span class="create-label">Description / Instructions <span class="required" aria-hidden="true">*</span></span>
              <textarea class="description-input" id="description" name="description" maxlength="100" placeholder="Ex: This assignment will evaluate your understanding of course concepts..." required></textarea>
              <span class="character-count" id="character-count">0/100</span>
            </label>

            <button class="next-button" type="button" id="next-section">
              <span>Next: Submission</span>
              <span class="material-icons" aria-hidden="true">arrow_forward</span>
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div class="form-message" id="form-message" role="status" aria-live="polite"></div>

  <script>
    const typeConfig = {
      assignment: {
        namePlaceholder: "Ex: Assignment 1 - Intro to CMSX",
        shortPlaceholder: "Ex: A1",
        steps: [
          ["Basic Info", "Name, status, description"],
          ["Submission", "Files, dates, limits"],
          ["Grading", "Scoring, rubric, graders"],
          ["Group Options", "Collaboration settings"],
          ["Content", "Provided files"]
        ]
      },
      quiz: {
        namePlaceholder: "Ex: Quiz 1 - Intro to CMSX",
        shortPlaceholder: "Ex: Q1",
        steps: [
          ["Basic Info", "Files, dates, limits"],
          ["Submission", "Files, dates, limits"],
          ["Grading", "Scoring, rubric, graders"],
          ["Content", "Provided Files"]
        ]
      },
      survey: {
        namePlaceholder: "Ex: Survey 1 - Intro to CMSX",
        shortPlaceholder: "Ex: S1",
        steps: [
          ["Basic Info", "Files, dates, limits"],
          ["Submission", "Files, dates, limits"],
          ["Grading", "Scoring, rubric, graders"],
          ["Content", "Provided Files"]
        ]
      }
    };

    let activeType = "assignment";
    const nameInput = document.getElementById("assignment-name");
    const shortNameInput = document.getElementById("short-name");
    const progressList = document.getElementById("progress-list");
    const message = document.getElementById("form-message");
    let messageTimer;

    function showMessage(text) {
      window.clearTimeout(messageTimer);
      message.textContent = text;
      message.classList.add("visible");
      messageTimer = window.setTimeout(() => message.classList.remove("visible"), 2400);
    }

    function renderSteps(steps) {
      progressList.innerHTML = steps.map((step, index) => `
        <li class="progress-step${index === 0 ? " active" : ""}">
          <span class="step-number">${index + 1}</span>
          <span class="step-copy">
            <span class="step-label">${step[0]}</span>
            <span class="step-description">${step[1]}</span>
          </span>
        </li>
      `).join("");
    }

    function selectType(type, updateUrl = true) {
      if (!typeConfig[type]) type = "assignment";
      activeType = type;
      document.querySelectorAll(".type-card").forEach((card) => {
        const selected = card.dataset.type === type;
        card.classList.toggle("selected", selected);
        card.setAttribute("aria-pressed", String(selected));
      });
      nameInput.placeholder = typeConfig[type].namePlaceholder;
      shortNameInput.placeholder = typeConfig[type].shortPlaceholder;
      renderSteps(typeConfig[type].steps);
      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set("type", type);
        window.history.replaceState({}, "", url);
      }
    }

    document.querySelectorAll(".type-card").forEach((card) => {
      card.addEventListener("click", () => selectType(card.dataset.type));
    });

    document.querySelectorAll('input[name="status"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        document.querySelectorAll(".status-option").forEach((option) => option.classList.remove("selected"));
        radio.closest(".status-option").classList.add("selected");
      });
    });

    const description = document.getElementById("description");
    description.addEventListener("input", () => {
      document.getElementById("character-count").textContent = `${description.value.length}/100`;
    });

    document.getElementById("save-draft").addEventListener("click", () => showMessage("Draft saved"));
    document.getElementById("publish").addEventListener("click", () => {
      if (document.getElementById("assignment-form").reportValidity()) {
        const label = activeType.charAt(0).toUpperCase() + activeType.slice(1);
        showMessage(`${label} published`);
      }
    });
    document.getElementById("next-section").addEventListener("click", () => {
      const steps = document.querySelectorAll(".progress-step");
      steps.forEach((step, index) => step.classList.toggle("active", index === 1));
      showMessage("Submission section selected");
    });
    document.getElementById("assignment-form").addEventListener("submit", (event) => event.preventDefault());

    const requestedType = new URLSearchParams(window.location.search).get("type");
    selectType(requestedType || "assignment", false);
  </script>
</body>
</html>
