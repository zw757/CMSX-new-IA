<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/theme-init.js"></script>
  <script type="module" src="sidebar.js"></script>
  <script type="module" src="designer-tag.js"></script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CS4998 – Search Logs</title><link rel="stylesheet" href="styles.css">
  <style>
    .logs-shell{max-width:1280px;margin:auto}.logs-header{align-items:center;margin-bottom:28px}.logs-card{background:#fff;border:1px solid var(--divider);border-radius:10px;overflow:hidden}.search-area{padding:24px;border-bottom:1px solid var(--divider)}
    .search-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}.search-box{position:relative}.search-box>.material-icons{position:absolute;left:14px;top:13px;color:var(--text-secondary)}.search-input{width:100%;height:48px;padding:0 46px;border:1px solid #aaa;border-radius:7px;font-size:16px;outline:0}.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #00669920}.search-clear{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;display:none}.search-clear:hover{background:var(--bg)}
    .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.filter-select,.filter-button{height:36px;padding:0 12px;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:14px}.filter-button{display:flex;align-items:center;gap:6px}.filter-button .material-icons{font-size:18px}.clear-filters{font-size:14px;color:var(--primary);padding:8px;display:none}.advanced{display:none;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--divider)}.advanced.open{display:grid}.compact label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}.compact input{width:100%;height:38px;padding:0 10px;border:1px solid #bbb;border-radius:5px}
    .results-head{min-height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.results-count{font-size:15px;font-weight:600}.results-note{font-size:13px;color:var(--text-secondary)}.table-wrap{overflow:auto}.logs-table{width:100%;border-collapse:collapse;min-width:800px}.logs-table th{height:42px;padding:0 16px;text-align:left;background:#f5f7f9;border-block:1px solid var(--divider);font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}.logs-table td{padding:15px 16px;border-bottom:1px solid var(--divider);font-size:14px}.log-row{cursor:pointer}.log-row:hover,.log-row:focus{background:#f5fafc;outline:0}.date-primary,.action-title{display:block;font-weight:600}.date-sub,.action-detail{display:block;margin-top:3px;font-size:12px;color:var(--text-secondary)}.user{font-weight:600;color:var(--primary-dark)}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;background:#edf4f7;color:#28566d;font-size:12px;font-weight:600}.tag.grade{background:#f4effa;color:#66438a}.tag.group{background:#eef6ef;color:#3e6945}.arrow{color:var(--text-secondary)}
    .empty{display:none;text-align:center;padding:70px 24px;border-top:1px solid var(--divider)}.empty .material-icons{font-size:32px;color:var(--text-secondary)}.empty h2{font-size:18px;margin:10px}.empty p{font-size:14px;color:var(--text-secondary);margin-bottom:16px}
    .backdrop{position:fixed;inset:0;background:#0004;z-index:300;opacity:0;pointer-events:none;transition:.2s}.backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:#fff;z-index:301;box-shadow:-8px 0 30px #0003;transform:translateX(102%);transition:.25s;overflow:auto}.drawer.open{transform:none}.drawer-header{padding:20px 24px;border-bottom:1px solid var(--divider);display:flex;justify-content:space-between;align-items:center}.drawer-header h2{font-size:18px}.icon-btn{width:36px;height:36px;border-radius:50%}.icon-btn:hover{background:var(--bg)}.drawer-body{padding:24px}.event{padding-bottom:22px;border-bottom:1px solid var(--divider)}.event h3{font-size:20px;margin:10px 0 5px}.event p{color:var(--text-secondary);font-size:14px}.details{display:grid;gap:20px;margin-top:22px}.details dt{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;margin-bottom:5px}.details dd{font-size:15px}.context-link{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:13px;margin-top:5px}.context-link .material-icons{font-size:16px}.callout{display:flex;gap:10px;padding:14px;margin-top:24px;border-radius:6px;background:#f5f7f9;color:var(--text-secondary);font-size:13px;line-height:1.45}
    .btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 15px;border-radius:6px;font-size:14px;font-weight:600}.btn .material-icons{font-size:19px}.btn-outlined{border:1px solid #bbb;background:#fff}.btn-outlined:hover{background:var(--bg)}
    @media(max-width:760px){.content-wrapper{padding:28px 20px}.logs-header{align-items:flex-start}.advanced{grid-template-columns:1fr}.results-note{display:none}}
  </style>
  <link rel="stylesheet" href="dark-theme.css" />
</head>
<body><div class="app-layout">
  <cmsx-sidebar></cmsx-sidebar>
  <main class="main-content"><div class="content-wrapper logs-shell">
    <div class="page-header logs-header"><div class="page-title-group"><h1 class="page-title">Search Logs</h1><nav class="breadcrumbs"><a class="breadcrumb-link" href="index.html">CS4998 Intro to CMSX</a><span class="breadcrumb-sep"><span class="material-icons">chevron_right</span></span><span class="breadcrumb-link">Search Logs</span></nav></div><button class="btn btn-outlined" onclick="exportLogs()"><span class="material-icons">download</span>Export CSV</button></div>
    <section class="logs-card"><div class="search-area"><label class="search-label" for="search">Search course activity</label><div class="search-box"><span class="material-icons">search</span><input id="search" class="search-input" type="search" placeholder="Search by NetID, action, assignment, or IP address"><button id="searchClear" class="search-clear" aria-label="Clear search"><span class="material-icons">close</span></button></div>
      <div class="filter-row"><select id="category" class="filter-select"><option value="">Category: All</option><option>Assignment</option><option>Grade</option><option>Group</option></select><select id="action" class="filter-select"><option value="">Action: All</option><option>Created assignment</option><option>Edited assignment</option><option>Submitted assignment</option><option>Changed grade</option><option>Joined group</option><option>Left group</option></select><select id="date" class="filter-select"><option value="">Date: Any time</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">Last 7 days</option></select><button id="more" class="filter-button" aria-expanded="false"><span class="material-icons">tune</span>More filters</button><button id="clear" class="clear-filters">Clear all</button></div>
      <div id="advanced" class="advanced"><div class="compact"><label for="affected">Affected NetID</label><input id="affected" placeholder="e.g. ab123"></div><div class="compact"><label for="simulated">Simulated NetID</label><input id="simulated" placeholder="e.g. cd456"></div><div class="compact"><label for="ip">IP address</label><input id="ip" placeholder="e.g. 128.84.0.1"></div></div>
    </div><div class="results-head"><span id="count" class="results-count"></span><span class="results-note">Select a row to view technical details</span></div><div id="tableWrap" class="table-wrap"><table class="logs-table"><thead><tr><th>Date</th><th>Performed by</th><th>Activity</th><th>Category</th><th></th></tr></thead><tbody id="body"></tbody></table></div><div id="empty" class="empty"><span class="material-icons">search_off</span><h2>No logs match these filters</h2><p>Try a different search or remove one of your filters.</p><button class="btn btn-outlined" onclick="clearAll()">Clear filters</button></div></section>
  </div></main>
</div><div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-header"><h2>Log details</h2><button id="close" class="icon-btn" aria-label="Close"><span class="material-icons">close</span></button></div><div id="drawerBody" class="drawer-body"></div></aside>
<script>
const logs=[
 {date:'May 1',time:'6:45 PM',stamp:'2026-05-01T18:45:45',user:'acm22',action:'Created assignment',target:'bean10',category:'Assignment',affected:'—',simulated:'—',ip:'10.48.111.52'},
 {date:'May 1',time:'6:42 PM',stamp:'2026-05-01T18:42:10',user:'acm22',action:'Edited assignment',target:'bean10',category:'Assignment',affected:'—',simulated:'—',ip:'10.48.111.52'},
 {date:'Apr 30',time:'3:18 PM',stamp:'2026-04-30T15:18:23',user:'zw757',action:'Submitted assignment',target:'Assignment 3',category:'Assignment',affected:'zw757',simulated:'—',ip:'128.84.14.38'},
 {date:'Apr 30',time:'2:07 PM',stamp:'2026-04-30T14:07:08',user:'acm22',action:'Changed grade',target:'zw757 · Assignment 2',category:'Grade',affected:'zw757',simulated:'—',ip:'10.48.111.52'},
 {date:'Apr 29',time:'5:28 PM',stamp:'2026-04-29T17:28:44',user:'aaa1',action:'Left group',target:'aa363',category:'Group',affected:'aaa1, aa363',simulated:'—',ip:'128.84.21.9'},
 {date:'Apr 29',time:'5:12 PM',stamp:'2026-04-29T17:12:31',user:'bbb2',action:'Joined group',target:'Final Project Group 8',category:'Group',affected:'bbb2',simulated:'—',ip:'128.84.20.17'}];
const $=id=>document.getElementById(id),search=$('search'),category=$('category'),action=$('action'),date=$('date'),extras=[$('affected'),$('simulated'),$('ip')];let visible=logs;
function render(){const q=search.value.toLowerCase(),x=extras.map(e=>e.value.toLowerCase());visible=logs.filter(l=>{const all=Object.values(l).join(' ').toLowerCase();const d=!date.value||(date.value==='today'?l.date==='May 1':date.value==='yesterday'?l.date==='Apr 30':true);return(!q||all.includes(q))&&(!category.value||l.category===category.value)&&(!action.value||l.action===action.value)&&d&&(!x[0]||l.affected.toLowerCase().includes(x[0]))&&(!x[1]||l.simulated.toLowerCase().includes(x[1]))&&(!x[2]||l.ip.includes(x[2]))});$('body').innerHTML=visible.map((l,i)=>`<tr class="log-row" tabindex="0" data-i="${i}"><td><span class="date-primary">${l.date}</span><span class="date-sub">${l.time}</span></td><td class="user">${l.user}</td><td><span class="action-title">${l.action}</span><span class="action-detail">${l.target}</span></td><td><span class="tag ${l.category.toLowerCase()}">${l.category}</span></td><td><span class="material-icons arrow">chevron_right</span></td></tr>`).join('');$('count').textContent=`${visible.length} ${visible.length===1?'log':'logs'}`;$('tableWrap').style.display=visible.length?'block':'none';$('empty').style.display=visible.length?'none':'block';$('searchClear').style.display=search.value?'block':'none';$('clear').style.display=(search.value||category.value||action.value||date.value||extras.some(e=>e.value))?'block':'none';document.querySelectorAll('.log-row').forEach(r=>{r.onclick=()=>openLog(visible[r.dataset.i]);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLog(visible[r.dataset.i])}}})}
function openLog(l){$('drawerBody').innerHTML=`<div class="event"><span class="tag ${l.category.toLowerCase()}">${l.category}</span><h3>${l.action}</h3><p>${l.date}, ${l.time}</p></div><dl class="details"><div><dt>Performed by</dt><dd><strong>${l.user}</strong></dd><a href="#" class="context-link" onclick="filterUser('${l.user}');return false">View all activity by ${l.user}<span class="material-icons">arrow_forward</span></a></div><div><dt>Target</dt><dd>${l.target}</dd></div><div><dt>Affected users</dt><dd>${l.affected}</dd></div><div><dt>Simulated user</dt><dd>${l.simulated}</dd></div><div><dt>IP address</dt><dd>${l.ip}</dd></div><div><dt>Timestamp</dt><dd>${new Date(l.stamp).toLocaleString()}</dd></div></dl><div class="callout"><span class="material-icons">info</span><span>Logs are created only for successfully completed actions. Failed or timed-out actions are not recorded.</span></div>`;$('backdrop').classList.add('open');$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false')}
function closeLog(){$('backdrop').classList.remove('open');$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')}function clearAll(){search.value=category.value=action.value=date.value='';extras.forEach(e=>e.value='');render()}function filterUser(u){search.value=u;closeLog();render();search.focus()}
function exportLogs(){const rows=[['Date','User','Action','Target','Category','Affected','Simulated','IP'],...visible.map(l=>[l.stamp,l.user,l.action,l.target,l.category,l.affected,l.simulated,l.ip])];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cmsx-logs.csv';a.click();URL.revokeObjectURL(a.href)}
search.oninput=render;[category,action,date].forEach(e=>e.onchange=render);extras.forEach(e=>e.oninput=render);$('searchClear').onclick=()=>{search.value='';render();search.focus()};$('clear').onclick=clearAll;$('more').onclick=function(){const o=$('advanced').classList.toggle('open');this.setAttribute('aria-expanded',o)};$('close').onclick=$('backdrop').onclick=closeLog;document.onkeydown=e=>{if(e.key==='Escape')closeLog()};render();
</script>
<cmsx-designer-tag name="erica" status="in-progress"></cmsx-designer-tag>
</body></html>
